# ============================================================
# 螺母抓放任务配置（双臂交接版，2026-09-10 正式 4 段轨迹）
#
# 流程：
#   0. 左右臂各按 left/right.ready 预录轨迹回放到末点（离场 ready 位），然后拍视觉
#   1. 视觉拍快照，得到每颗螺母位置（大中小，顺序 order 决定）
#   2. 对每颗螺母：
#      左臂：视觉 MoveJP/MoveL 抓起 -> 回放 left_grasp_place_middle（末点张手放中央）
#            -> 回放 left_middle_back 回位（纯运动段）
#      右臂：回放 right_grasp_middle（末点闭合重抓）
#            -> 回放 right_middle_back（末点张手释放，三颗共用这一条）
#   3. 下一颗前框架自动慢速 MoveJ 接入各段首点；段内逐点 MoveJ
#
# 「腿（leg）」：一条预录手动关节序列（record_workpoints 录的 schema v3），
#   hand_after 在【段终点】触发；相邻段端点不一致时框架以 join_speed 慢速 MoveJ
#   直动接入（无避障），dry-run 的「段间接入距离」报告会列出这些移动。
# ============================================================

namespace: /robot1
arm: right                 # 只给 capture_task_pose 选默认臂用；任务固定双臂

# 抓取顺序选项：l=大 m=中 s=小；任意排列，如 [l,m,s] / [s,m,l] / [m,l,s]
order: [l, m, s]
require_all: false          # true=缺一颗中止；false=只抓检测到的

check_other_arm: true      # 序列加载/回放时校验另一只臂静止（录制时另一只臂必须停着）

# ---- 左臂（视觉引导抓取 + 放桌面中央），2026-09-10 正式录制 ----
#   left_middle_grasp_001（left_grasp_middle1/） 抓取区 -> 桌面中央（末点 OPEN 释放）
#   left_middle_back_001         中央抬起 -> 回位（纯运动段，无手动作）
left:
  # 视觉 MoveJP/MoveL 的三个旋转角来源（只取姿态，位置由视觉覆盖）：
  #   写法1 位姿库名：grasp_orientation: left_grasp_init（task_poses.yaml，capture_task_pose 采）
  #   写法2 记录段点：grasp_orientation: {file: recordings/left_grasp_middle/events.jsonl,
  #                                      sequence: left_grasp_place_middle_001, point: 0}
  #         取该记录点的末端姿态（pt0 eul≈[63.7,-1.3,-95.4]°，在抓取区录到的真实臂型）
  grasp_orientation: left_grasp_init
  # 按尺寸分别给抓取姿态（只取欧拉角，xyz 仍由视觉检测点+偏移决定）；任一行可省，省的用上面的全局姿态。
  # 值写法与全局相同：位姿库名（采集：/usr/bin/python3 tools/capture_task_pose.py --arm left --name <名>）
  # 或 {file?, sequence, point?} 记录段映射。位姿不存在时 --execute 会在运动前中止并报缺哪个名字。
  # 2026-09-11：m/s 各采独立姿态（task_poses.yaml 的 left_grasp_m/s）；l 不写=沿用 left_grasp_init。
  grasp_orientation_by_size:
    m: left_grasp_m
    s: left_grasp_s
  # 序列默认文件（每段也可写 file: 单独指定）；相对工作区根目录（tools 的上一级）
  trace: recordings/left_grasp_middle/events.jsonl
  # 开机 ready 段：上使能+张手后逐点 MoveJ 回放，末点=视觉检测时停住的离场 ready 位。
  # 改 ready 姿态就重录一条序列并改这里的 file/sequence（不允许配 hand_after）。
  ready: {file: recordings/20260915_175547_556799/events.jsonl, sequence: left-ready_001}
  legs:                      # 视觉抓起后【依次】回放；段尾手动作由框架发
    - {file: recordings/left_grasp_middle1/events.jsonl, sequence: left_middle_grasp_001, hand_after: open}
    - {file: recordings/left_middle_back/events.jsonl, sequence: left_middle_back_001}

# ---- 右臂（中央重抓 + 放回右侧），2026-09-10 正式录制 ----
#   right_grasp_middle1_001（right_middle_grasp1/） home -> 桌面中央（末点 CLOSE 重抓）
#   right_grasp_move1_001（right_middle_back1/）    中央 -> 右侧（末点 OPEN 释放）；三颗共用同一条
right:
  trace: recordings/right_grasp_middle/events.jsonl
  # 开机 ready 段（同左臂）：right_trace 里的 right_ready1_001，末点离场
  ready: {file: recordings/20260915_134046_684005/events.jsonl, sequence: right-ready_001}
  # 中央重抓段：home -> 桌面中央，段尾 CLOSE 重抓。
  # 单段写法=三颗共用（当前）。中小螺母拇指高度不够时改按尺寸三选一：
  #   先 cp -r recordings/right_middle_grasp1 recordings/right_middle_grasp1_ms，
  #   用 retune_waypoint.py 只调副本末点（--dz 负值=更低，可加 --drx 俯仰），再写：
  approach:
    l: {file: recordings/right_middle_grasp1/events.jsonl, sequence: right_grasp_middle1_001, hand_after: close}
    m: {file: recordings/right_middle_grasp1_m/events.jsonl, sequence: right_grasp_middle1_001, hand_after: close}
    s: {file: recordings/right_middle_grasp1_s/events.jsonl, sequence: right_grasp_middle1_001, hand_after: close}
  # 注意三段首点应保持一致（复制只改末点即可）；dry-run 的交接点/段间接入行会逐尺寸报告。
  # approach: {file: recordings/right_middle_grasp1/events.jsonl,
  #            sequence: right_grasp_middle1_001, hand_after: close}
  # 三颗放回同一位置：place 直接写单段；若三颗各放各格则写成 l:/m:/s: 三段
  # place: {file: recordings/right_middle_back1/events.jsonl,
          # sequence: right_grasp_move1_001, hand_after: open}
  place:
    l: {file: recordings/right_middle_back1/events.jsonl,    sequence: right_grasp_move1_001, hand_after: open}
    m: {file: recordings/right_middle_back1_m/events.jsonl, sequence: right_grasp_move1_001, hand_after: open}
    s: {file: recordings/right_middle_back1_s/events.jsonl, sequence: right_grasp_move1_001, hand_after: open}


# ---- 运动参数 ----
motion:
  # 视觉段（左臂抓螺母）：MoveJP 到上方、MoveL 竖直下探/抬起
  speed: 0.3
  acce: 0.3
  linear_speed: 0.2
  linear_acce: 0.2
  hover_height: 0.10        # 接近悬停：腕部相对检测点的高度 m（必须大于 grasp_z_offset）
  grasp_z_offset: 0.1      # 下探终点相对视觉点 z 微调，要指尖更低给负值如 -0.01
  # 抓稳后先竖直上抬的高度（相对下探终点 down 向上），抬起后才回放固定段；缺省 0.05m
  lift_height: 0.05
  # 检测点(螺母位置) -> 腕部目标的 base_link 系平移 m，三种检测器统一生效。
  # 视觉点选对准的是腕部（法兰），指尖抓取中心在腕前约 15cm：
  # 腕部目标向机体方向（base_link -X）退 15cm，指尖才正好到螺母。实测后按毫米微调这三个数。
  grasp_offset_xyz: [-0.08, 0.02, 0.00]
  # 大/中/小螺母分别微调视觉抓取几何（每字段可省，省的回退上面的全局值；单位米）：
  #   offset_xyz  = 检测点->腕部目标平移（base_link 系，负 X=向机体退，同全局 grasp_offset_xyz）
  #   z_offset    = 下探终点相对检测点的 z 微调（同全局 grasp_z_offset）
  #   hover_height= 接近悬停高度（同全局 hover_height；必须严格大于 z_offset，否则
  #                 接近段上抬、抓后回 hover 下杵桌面，加载配置即报错）
  #   lift_height = 抓稳后相对下探终点竖直上抬多高再回放固定段（缺省用上面的 0.05）
  grasp_by_size:
    l: {offset_xyz: [-0.01, -0.06, 0.0], z_offset: 0.09, hover_height: 0.12}
    m: {offset_xyz: [-0.022, -0.073, 0.0], z_offset: 0.08, hover_height: 0.12}
    s: {offset_xyz: [-0.004, -0.035, 0.0], z_offset: 0.07, hover_height: 0.12}

  # 序列段：逐点 MoveJ
  join_speed: 0.3          # 接入序列起点 / retreat 回 home 的慢速 MoveJ
  join_acce: 0.3
  join_seg_threshold: 0.8   # 分段插值阈值 rad/段（>0.8 才插）
  sequence_speed: 0.5       # 序列逐点速度（record 回放惯例 <=0.5）
  sequence_acce: 0.5
  state_timeout: 0.5        # 反馈过期判定 s

  settle_seconds: 0.6       # 闭合后静置（等抓稳）
  release_seconds: 0.6      # 张手后静置（等螺母离手/落下）
  move_timeout: 60.0        # 单次运动服务超时 s

  # 节奏停顿（嫌衔接快就调大这些）
  ready_hold_seconds: 1.0   # 开机双臂到 ready 后保持多久再检测
  point_dwell_seconds: 0.05  # 预录序列每个点到位后停顿
  between_leg_seconds: 0.8  # 段与段之间 / 螺母之间
  pre_hand_seconds: 0.3     # 发张/合手指令前停顿
  hover_dwell_seconds: 0.5  # 视觉段到螺母上方后、竖直下探前停顿

  # 回放安全容差（沿用 replay_workpoints 的量级）
  start_tolerance: 0.05     # 与段起点偏差 <= 此值不补动
  reached_tolerance: 0.03   # 到位关节容差（默认）
  reached_tolerance_left: 0.1   # 左臂 ready 接入 pt0 时 Wrist_Roll 稳态停在 ~0.081rad（4.7°），重发无效，单独放宽
  reached_tolerance_right: 0.05  # 右臂持螺母伸展姿态肩滚转稳态停在 ~0.033rad（1.9°），重发无效，单独放宽≈2.9°
  reached_wait_seconds: 3.0 # 服务完成后等反馈进入容差的最长时间（伺服收敛/下沉有滞后，>=0.5）
  reached_reissue_count: 2 # 未到位时同目标指令最多补发次数（0=不补发直接中止；稳态残差请调容差而非加次数）
  # 视觉 MoveJP/MoveL 的笛卡尔到位核对（block 服务会提前返回，必须核对末端实际位姿）
  pose_pos_tolerance: 0.01 # 末端位置容差 m（10mm；不到位自动补发同目标）
  pose_ori_tolerance: 0.05 # 末端姿态容差 rad（≈2.9°）
  other_tolerance: 0.05     # 回放中另一只臂漂移上限

# ---- 灵巧手（6 路：[拇指侧摆,拇指弯曲,食,中,无名,小]，0~255）----
hand:
  speed: [80, 80, 80, 80, 80, 80]
  force: [100, 100, 100, 100, 100, 100]
  # 张开手型（2026-09-10 现场给定）：[拇指侧摆,拇指弯曲,食,中,无名,小]
  open: [200, 80, 255, 255, 255, 255]
  # 各臂闭合默认值（2026-09-10 现场给定，三颗螺母先共用；当晚小拇指也改为闭合 0，原 255 为张开）
  close:
    left:  [0, 0, 0, 0, 0, 0]
    right: [0, 0, 0, 0, 0, 0]  # 双臂六路全闭（2026-09-11 现场调定值）
  # 若某尺寸要单独手型，按尺寸覆盖（优先级高于 close），三种写法：
  # sizes:
  #   l: {joint: [180, 180, 180, 180, 180, 180]}          # 双臂共用
  #   m: {left: [0,60,0,0,0,255], right: [0,100,0,0,0,255]}  # 分臂
  #   s: {joint: [120, 120, 120, 120, 120, 120]}

# ---- 视觉话题与标定 ----
vision:
  color_topic: /camera/color/image_raw
  color_info_topic: /camera/color/camera_info
  depth_topic: /camera/depth/image_raw       # depth_registration:=true 的对齐深度
  depth_info_topic: /camera/depth/camera_info
  extrinsics: ''      # 留空=开发资源/calibration/gemini2_extrinsics.yaml（双臂共用 base_link 系）
  camera_info: ''

# ---- 检测器（manual 点选 / json / external 自接）----
# 自动视觉识别：把 type 改成 external 即用 nut_vision（黑框+深度平面分割）。
#   pick：同尺寸多颗时每档取哪颗——leftmost 最左（默认）/ largest 最大 /
#         all 全报（同档多颗框架会按既有保护中止，待多选扩展）
#   dry-run 离线核对：配 snapshot: 开发资源/nut_sort/snapshots/<目录>
# 临时跑通流程可用 --detector input：终端直接输入三颗螺母 base_link 位置（米），不走相机
# 联调旧桩：external 换成 nut_detector_ref.py:RefNutDetector（固定位姿，base_link 系）
detector:
  type: manual
  # 主流程 --detector yolo 启用；模型路径相对工作区。
  model: weights/nut_best.pt
  # auto 优先工作区 .venv-yolo，其次 ~/miniconda3/envs/nut-yolo；也可指定解释器路径。
  # 推理子进程与 ROS Python 隔离。
  python: auto
  confidence: 0.5
  imgsz: 640
  device: cpu
  camera_timeout: 10
  inference_timeout: 30
  max_frame_age: 1.0
  max_skew: 0.1
  max_result_age: 10
  # 推理后帧龄超过 max_result_age（CPU 冷启动偶发）或单次推理失败时，
  # 丢弃旧帧、重新取一对新帧重发识别，最多 inference_retries 次后才中止
  inference_retries: 3
  # 业务层：整轮识别后若缺型号（require_all=true），等 missing_retry_seconds 秒
  # 重新拍快照整体重识别，最多 detect_attempts 轮（含首轮）都缺才中止
  detect_attempts: 3
  missing_retry_seconds: 1.0
  # 逐颗重识别（默认 true）：第一颗用首轮快照，此后每抓一颗前双臂直接慢速 MoveJ 回
  # ready 段末点（离场位，不重放整段/不经过竖直起点），再重新拍快照只识别剩余螺母
  # ——抓前一颗可能碰动其余螺母，旧位置不再可信。
  # 新鲜检测点在运动前同样过 hover/down IK 预检；找不到当前尺寸螺母则安全中止。
  # 改成 false=三颗都用首轮快照位置连抓。
  redetect_each_nut: false
  # 识别弹窗：等帧时显示实时画面，出框后画检测框/置信度/中心深度，停留 show_seconds
  # 秒自动继续（空格/回车立即继续，q/ESC 中止；0=必须按键才继续）。无显示环境自动不弹。
  # 命令行 --show 可在 yaml 关闭时强制打开。
  show_window: true
  show_seconds: 2.0
  roi: null  # 可选：原图工作区 [xmin, ymin, xmax, ymax]；仅保留中心位于区内的检测
  json_path: detections.json
  params: 开发资源/nut_sort/nut_vision.yaml
  pick: leftmost
  # 同型号多目标（如画面里两颗中螺母/两颗小螺母）：
  #   random=随机抓一颗继续（当前选用）；first=取检测结果第一颗；abort=中止（缺省安全行为）
  duplicate_policy: random
  external: '/home/ran/lbot_ws/开发资源/nut_sort/nut_vision_detector.py:NutVisionDetector'
